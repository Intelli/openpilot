name: ev9 branch sync

on:
  push:
    branches:
      - ev9-dev
  workflow_dispatch:

jobs:
  sync:
    name: sync ev9-dev to ev9
    runs-on: ubuntu-latest
    steps:
      - name: Run sync script
        env:
          SYNC_AUTHOR_NAME: GitHub Actions
          SYNC_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin ev9-dev:refs/remotes/origin/ev9-dev
          git fetch --no-tags origin ev9:refs/remotes/origin/ev9
          bash tools/ci/sync_ev9_branch.sh

