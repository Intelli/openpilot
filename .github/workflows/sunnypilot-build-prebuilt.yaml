name: sunnypilot build prebuilt

env:
  BUILD_DIR: ${{ github.workspace }}/openpilot
  OUTPUT_DIR: ${{ github.workspace }}/output
  CI_DIR: ${{ github.workspace }}/release/ci
  SCONS_CACHE_DIR: ${{ github.workspace }}/release/ci/scons_cache
  PUBLIC_REPO_URL: "https://github.com/Intelli/openpilot"
  STAGING_SOURCE_BRANCH: "ev9-dev"
  SOURCE_BRANCH: "${{ github.head_ref || github.ref_name }}"

on:
  push:
    branches: [ ev9-dev ]
  pull_request_target:
    types: [ labeled ]
  workflow_dispatch:

jobs:
  prepare_strategy:
    runs-on: ubuntu-24.04
    outputs:
      new_branch: ${{ steps.set.outputs.new_branch }}
      version: ${{ steps.set.outputs.version }}
      environment: ${{ steps.set.outputs.environment }}
      extra_version_identifier: ${{ steps.set.outputs.extra_version_identifier }}
      cancel_publish_in_progress: ${{ steps.set.outputs.cancel_publish_in_progress }}
      publish_concurrency_group: ${{ steps.set.outputs.publish_concurrency_group }}
      is_stable_branch: ${{ steps.set.outputs.is_stable_branch }}
      build: ${{ steps.set.outputs.build }}
    steps:
      - name: Compute strategy
        id: set
        shell: bash
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Current branch: $BRANCH"

          STRATEGY_JSON='${{ vars.DEPLOY_STRATEGY }}'
          if [[ -z "$STRATEGY_JSON" || "$STRATEGY_JSON" == "null" ]]; then
            STRATEGY_JSON='{ "configs": [] }'
          fi
          CONFIG=$(echo "$STRATEGY_JSON" | jq -r --arg branch "$BRANCH" '.configs[] | select(.branch == $branch)')

          BUILD="$(date '+%Y.%m.%d')-${{ github.run_number }}"
          if [[ -z "$CONFIG" || "$CONFIG" == "null" ]]; then
            echo "No exact strategy match found. Falling back to Intelli ev9-dev defaults."
            if [[ "$BRANCH" == "ev9-dev" ]]; then
              NEW_BRANCH="ev9-prebuilt"
              echo "cancel_publish_in_progress=false" >> $GITHUB_OUTPUT
              echo "publish_concurrency_group=publish-ev9-dev" >> $GITHUB_OUTPUT
              echo "environment=ev9-dev" >> $GITHUB_OUTPUT
              echo "extra_version_identifier=ev9-dev" >> $GITHUB_OUTPUT
            else
              IS_FORK="${{ github.event.pull_request.head.repo.fork && 'true' || 'false' }}"
              FORK_SUFFIX=$( [[ "$IS_FORK" == "true" ]] && echo "-fork" || echo "" )
              NEW_BRANCH="${BRANCH}${FORK_SUFFIX}-prebuilt"
              echo "cancel_publish_in_progress=true" >> $GITHUB_OUTPUT
              echo "publish_concurrency_group=publish-${BRANCH}" >> $GITHUB_OUTPUT
              echo "environment=feature-branch" >> $GITHUB_OUTPUT
              echo "extra_version_identifier=feature-branch" >> $GITHUB_OUTPUT
            fi
            echo "new_branch=$NEW_BRANCH" >> $GITHUB_OUTPUT
            echo "version=$BUILD" >> $GITHUB_OUTPUT
            echo "is_stable_branch=false" >> $GITHUB_OUTPUT
          else
            environment=$(echo "$CONFIG" | jq -r '.environment')
            branch=$(echo "$CONFIG" | jq -r '.branch')
            extra_id=$(echo "$CONFIG" | jq -r '.extra_version_identifier // "feature-branch"')
            cancel="$(echo "$CONFIG" | jq -r '.cancel_publish_in_progress')";
            echo "new_branch=$branch" >> $GITHUB_OUTPUT
            echo "version=$BUILD" >> $GITHUB_OUTPUT
            echo "environment=$environment" >> $GITHUB_OUTPUT
            echo "extra_version_identifier=$extra_id" >> $GITHUB_OUTPUT
            echo "cancel_publish_in_progress=$( [ "$cancel" = "null" ] && echo "true" || echo $cancel)" >> $GITHUB_OUTPUT
            echo "publish_concurrency_group=publish-${BRANCH}$( [ "$cancel" = "null" ] || [ "$cancel" = "true" ] || echo "${{ github.sha }}" )" >> $GITHUB_OUTPUT
            is_stable_branch="$(echo "$CONFIG" | jq -r '.stable_branch // false')"
            echo "is_stable_branch=$is_stable_branch" >> $GITHUB_OUTPUT
          fi
          echo "build=$BUILD" >> $GITHUB_OUTPUT

  build:
    needs: [ prepare_strategy ]
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/ev9-dev') || (github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'prebuilt') || github.event_name == 'workflow_dispatch' }}
    container:
      image: ghcr.io/sunnypilot/sunnypilot-prebuilt:latest
    outputs:
      new_branch: ${{ needs.prepare_strategy.outputs.new_branch }}
      version: ${{ needs.prepare_strategy.outputs.version }}
      extra_version_identifier: ${{ needs.prepare_strategy.outputs.extra_version_identifier }}
      environment: ${{ needs.prepare_strategy.outputs.environment }}
      cancel_publish_in_progress: ${{ needs.prepare_strategy.outputs.cancel_publish_in_progress }}
      publish_concurrency_group: ${{ needs.prepare_strategy.outputs.publish_concurrency_group }}
      build: ${{ needs.prepare_strategy.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
          ref: ${{ env.SOURCE_BRANCH }}
          repository: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Configure Git LFS mirror
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git config lfs.url https://gitlab.com/sunnypilot/public/sunnypilot-new-lfs.git/info/lfs

      - name: Fetch LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs pull --exclude="auto-lock/lock-closed-white.*" --include=""

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: ${{env.SCONS_CACHE_DIR}}
          key: scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}
          restore-keys: |
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}

      - name: Setup build environment
        run: |
          mkdir -p "${BUILD_DIR}/"
          sudo find "$BUILD_DIR/" -mindepth 1 -delete
          if [ -x "${{ github.workspace }}/scripts/manage-powersave.py" ]; then
            PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ "${{ github.workspace }}/scripts/manage-powersave.py" --disable
          fi

      - name: Build Main Project
        run: |
          cd $BUILD_DIR
          sed -i '/from .board.jungle import PandaJungle, PandaJungleDFU/s/^/#/' panda/__init__.py
          scons -j$(nproc) cache_dir=${{env.SCONS_CACHE_DIR}} --minimal
          python3 opendbc_repo/opendbc/dbc/generator/generator.py
          touch ${BUILD_DIR}/prebuilt

      - name: Cleanup build artifacts
        run: |
          cd $BUILD_DIR
          find . -name '*.a' -delete || true
          find . -name '*.o' -delete || true
          find . -name '*.os' -delete || true
          find . -name '*.pyc' -delete || true
          find . -name 'moc_*' -delete || true
          rm -rf .sconsign.dblite Jenkinsfile release/ || true
          rm -rf third_party/x86*/ third_party/*Darwin*/ || true

      - name: Restore third_party
        run: |
          cd $BUILD_DIR
          git checkout -- third_party/ || true

      - name: Prepare Output
        run: |
          sudo rm -rf ${OUTPUT_DIR}
          mkdir -p ${OUTPUT_DIR}
          rsync -am \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.cc' \
            --exclude='*.pyc' \
            --exclude='moc_*' \
            --exclude='supercombo.onnx' \
            --exclude='**/.github/' \
            --exclude='**/__pycache__/' \
            --exclude='**/selfdrive/ui/*.h' \
            --exclude='**/selfdrive/ui/**/*.h' \
            --exclude='${{env.SCONS_CACHE_DIR}}' \
            --exclude='**/.git/' \
            --exclude='**/SConstruct' \
            --exclude='**/SConscript' \
            --exclude='**/.DS_Store' \
            "${BUILD_DIR}/" "${OUTPUT_DIR}/"

      - name: Re-enable powersave
        if: always()
        run: |
          if [ -x "${{ github.workspace }}/scripts/manage-powersave.py" ]; then
            PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ "${{ github.workspace }}/scripts/manage-powersave.py" --enable
          fi

  publish:
    needs: [ prepare_strategy, build ]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ needs.prepare_strategy.outputs.publish_concurrency_group }}
      cancel-in-progress: ${{ fromJSON(needs.prepare_strategy.outputs.cancel_publish_in_progress) }}
    steps:
      - name: Publish prebuilt
        env:
          CI_DIR: ${{ env.CI_DIR }}
        run: |
          echo '${{ toJSON(needs.build.outputs) }}'
          ls -la ${{ env.OUTPUT_DIR }}

          git config --global http.postBuffer 1048576000
          git config --global transfer.fsckObjects false
          git config --global fetch.fsckObjects false
          git config --global receive.fsckObjects false

          ${{ env.CI_DIR }}/publish.sh \
            "${{ github.workspace }}" \
            "${{ env.OUTPUT_DIR }}" \
            "${{ needs.build.outputs.new_branch }}" \
            "${{ needs.build.outputs.version }}" \
            "https://x-access-token:${{secrets.PREBUILT_PUSH_TOKEN}}@github.com/Intelli/openpilot.git" \
            "${{ needs.build.outputs.extra_version_identifier }}"
