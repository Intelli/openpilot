# Keep this name: the ev9 source-sync workflow on master listens for it.
name: sunnypilot prebuilt action

on:
  push:
    branches: [ev9-dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ev9-starpilot-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/ev9-dev'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build upstream device container
        run: scripts/laptop_device_build.sh build-image
      - name: Extract device sysroot from upstream AGNOS image
        run: scripts/laptop_device_build.sh setup-sysroot-agnos
      - name: Build StarPilot for AGNOS
        # Upstream clears the SCons signature database and disables its cache,
        # rebuilding native targets while preserving device-specific model assets.
        run: |
          rm -f prebuilt
          ./build "$(nproc)"
      - name: Package deployment
        run: |
          mkdir -p "$RUNNER_TEMP/prebuilt-output"
          rsync -a --exclude='.git' --exclude='.github' \
            --exclude='.comma_sysroot' --exclude='.cache' --exclude='.venv*' \
            --exclude='__pycache__' --exclude='.sconsign*' \
            --exclude='*.o' --exclude='*.os' --exclude='*.a' \
            --exclude='moc_*' --exclude='.build' \
            --exclude='.lfsconfig' --exclude='.gitattributes' --exclude='.gitmodules' \
            ./ "$RUNNER_TEMP/prebuilt-output/"
          tar czf "$RUNNER_TEMP/prebuilt.tar.gz" -C "$RUNNER_TEMP/prebuilt-output" .
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: ev9-dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: ${{ runner.temp }}
      - name: Publish device build
        env:
          GH_TOKEN: ${{ secrets.PREBUILT_PUSH_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/prebuilt-output"
          tar xzf "$RUNNER_TEMP/prebuilt.tar.gz" -C "$RUNNER_TEMP/prebuilt-output"
          gh auth setup-git
          release/ci/publish.sh "$RUNNER_TEMP/prebuilt-output" "$GITHUB_SHA"
