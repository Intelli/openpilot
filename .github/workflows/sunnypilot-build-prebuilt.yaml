# Keep this name: the ev9 deployment-sync workflow on master listens for it.
name: sunnypilot prebuilt action

on:
  push:
    branches: [ev9-dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ev9-sunnypilot-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/ev9-dev'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify pinned device model inputs
        run: python3 tools/laptop_device_build/verify_model_assets.py --require-qcom
      - name: Build upstream device container
        run: scripts/laptop_device_build.sh build-image
      - name: Extract device sysroot from upstream AGNOS image
        run: scripts/laptop_device_build.sh setup-sysroot-agnos
      - name: Compile Sunnypilot for AGNOS 17.2
        # Rebuild all native application/firmware targets from this source.
        # Only allowlisted, hash-verified QCOM model captures are preserved.
        run: |
          rm -f prebuilt
          ./build "$(nproc)"
      - name: Package deployment
        run: |
          mkdir -p "$RUNNER_TEMP/prebuilt-output"
          rsync -a --exclude='.git' --exclude='.github' \
            --exclude='.comma_sysroot' --exclude='.cache' --exclude='.venv*' \
            --exclude='__pycache__' --exclude='.sconsign*' \
            --exclude='*.o' --exclude='*.os' --exclude='*.a' \
            --exclude='moc_*' --exclude='.build' \
            --exclude='/tools/laptop_device_build/model_assets' \
            --exclude='.lfsconfig' --exclude='.gitattributes' --exclude='.gitmodules' \
            ./ "$RUNNER_TEMP/prebuilt-output/"
          python3 tools/laptop_device_build/verify_build.py "$RUNNER_TEMP/prebuilt-output"
          python3 - "$RUNNER_TEMP/prebuilt-output" <<'PY'
          import sys
          from pathlib import Path
          too_large = [str(p) for p in Path(sys.argv[1]).rglob('*') if p.is_file() and p.stat().st_size > 95 * 1024 * 1024]
          if too_large:
            raise SystemExit('Files exceed deployment size limit: ' + ', '.join(too_large))
          PY
          tar czf "$RUNNER_TEMP/prebuilt.tar.gz" -C "$RUNNER_TEMP/prebuilt-output" .
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: ev9-dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: ${{ runner.temp }}
      - name: Publish device build
        env:
          GH_TOKEN: ${{ secrets.PREBUILT_PUSH_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/prebuilt-output"
          tar xzf "$RUNNER_TEMP/prebuilt.tar.gz" -C "$RUNNER_TEMP/prebuilt-output"
          gh auth setup-git
          release/ci/publish.sh "$RUNNER_TEMP/prebuilt-output" "$GITHUB_SHA"
